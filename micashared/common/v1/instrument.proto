syntax = "proto3";

package micashared.common.v1;

import "micashared/common/enums/ageband/v1/age_band.proto";
import "micashared/common/v1/address.proto";
import "validate/validate.proto";

option go_package = "micashared/common/v1;commonv1";
option java_outer_classname = "InstrumentProto";
option java_package = "io.micashared.common.v1";
option objc_class_prefix = "MICA";

// Display details for an instrument that has been linked, so an app can show the user which instrument a link uses.
message LinkedInstrumentData {
    // Display name of the instrument, such as the nickname the Issuer gave it.
    string name = 1;

    // Kind of instrument, as a name such as "DepositAccount", "CreditAccount", "Prepaid", "GovernmentBenefit",
    // "TaxAdvantaged", "EmployerBenefit", "MerchantCredit" or "Promotion". Empty when not known.
    string type = 2;

    // URL of an icon for the organization behind the instrument. May be empty.
    string icon_url = 3;
}

// Personal details about a user. All fields are optional and are personally identifiable information: send only
// what the receiving side needs.
message UserDemographic {
  // The first name of the user.
  string first_name = 1; // @gotags: mask:"pii"

  // The last name of the user.
  string last_name = 2; // @gotags: mask:"pii"

  // The email of the user.
  string email = 3; // @gotags: mask:"pii"

  // The street address of the user.
  micashared.common.v1.Address address = 4;

  // The age band of the user.
  micashared.common.enums.ageband.v1.AgeBand age_band = 7;

  // Phone number in E.164 format: a "+", the country code and the subscriber number, 11 to 15 digits in total, for
  // example "+14155550100". May be empty.
  string phone = 6 [(validate.rules).string.pattern = "^$|^\\+[1-9]\\d{10,14}$"]; // @gotags: mask:"pii"
}

// Information one side of the network shares with the other when an instrument is linked, for example details the
// Issuer knows about the user that the Acceptor needs. Mica forwards the claims; it does not interpret them.
message InstrumentLinkClaims {
    // Free-form claims as key/value pairs. The keys and their meaning are agreed between the members exchanging them.
    map<string, string> assertions = 1;

    // Structured details about the user.
    UserDemographic user_demographic = 2;
}
