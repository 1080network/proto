syntax = "proto3";

package micashared.common.v1;

option go_package = "micashared/common/v1;commonv1";
option java_outer_classname = "UUEKProto";
option java_package = "io.micashared.common.v1";
option objc_class_prefix = "MICA";

// Details about the instrument behind a UUEK that do not change between transactions. A UUEK changes, but these
// values stay the same, so they can be used to recognise the same underlying instrument across transactions.
message ImmutableInstrumentDetails {
  // Stable identifier of the instrument: 64 lowercase hexadecimal characters, the same for every transaction made
  // with that instrument. It cannot be used to make a payment.
  string identifier = 1;
}
