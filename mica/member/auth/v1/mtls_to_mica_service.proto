syntax = "proto3";

package mica.member.auth.v1;

import "google/protobuf/timestamp.proto";
import "micashared/common/v1/error.proto";
import "validate/validate.proto";

option go_package = "mica/member/authv1";
option java_outer_classname = "MTLSToMicaServiceProto";
option java_package = "io.mica.member.auth.v1";
option objc_class_prefix = "MICA";

// Manages the client certificates ("to Mica" certificates) that a member uses to authenticate its calls to Mica's
// Issuer and Acceptor APIs over mutual TLS. Each certificate carries a set of roles that decide which calls it may
// make. You keep the private key: you send Mica a certificate signing request (CSR) and Mica returns the signed
// certificate.
//
// Every call requires a certificate with the matching permission; a caller without it gets the gRPC status
// `PERMISSION_DENIED`.
service MTLSToMicaService {

  // Signs a CSR and returns a new client certificate with the requested roles. The certificate is enabled
  // immediately.
  rpc GenerateCertificate(GenerateCertificateRequest) returns (GenerateCertificateResponse) {}

  // Re-enables a disabled certificate so that it can be used again.
  rpc EnableCertificate(EnableCertificateRequest) returns (EnableCertificateResponse) {}

  // Disables a certificate: Mica rejects calls made with it until it is enabled again. Use this to revoke access.
  rpc DisableCertificate(DisableCertificateRequest) returns (DisableCertificateResponse) {}

  // Lists every certificate issued for this member, including disabled and expired ones. Takes no filters. The listed
  // certificates do not include PEM data; use GetCertificate for that.
  rpc SearchCertificate(SearchCertificateRequest) returns (SearchCertificateResponse) {}

  // Returns one certificate, including its PEM data, by serial number.
  rpc GetCertificate(GetCertificateRequest) returns (GetCertificateResponse) {}
}

// A certificate signing request.
message MTLSCertificateSignatureRequest {
  // PKCS#10 certificate signing request as a PEM string, encoded with standard base64. Required.
  string base64_pem_csr = 1 [(validate.rules).string.min_len = 1];
}

// A client certificate a member uses to call Mica.
message ToMicaCertificate {
  // Serial number of the certificate, as a decimal string. Use it to refer to the certificate in other calls.
  string serial_number = 1 [(validate.rules).string.min_len = 1];

  // When the certificate was issued.
  google.protobuf.Timestamp issued = 2;

  // When the certificate expires. Generate and switch to a new certificate before then.
  google.protobuf.Timestamp expiry = 3 [(validate.rules).timestamp.required = true];

  // Whether the certificate may be used. A disabled certificate is rejected even if it has not expired.
  bool enabled = 4;

  // The signed certificate as a PEM string, encoded with standard base64. Not included in SearchCertificate results.
  string base64_certificate_pem = 12;

  // CA certificates of Mica's server, as a PEM string encoded with standard base64. Add them to your client's trust
  // store so it can verify Mica's server certificate. Not included in SearchCertificate results.
  string base64_rootca_pem = 13;

  // Roles granted to the certificate. They decide which calls it may make.
  repeated string roles = 9;

  // Friendly name of the certificate.
  string display_name = 10;

  // When the certificate was last used to call Mica. Updated periodically, so it can lag behind by a short time.
  // Empty if it has never been used.
  google.protobuf.Timestamp last_used = 11;
}

// Request to sign a new client certificate.
message GenerateCertificateRequest {
  // Your certificate signing request. Required.
  MTLSCertificateSignatureRequest csr = 1 [(validate.rules).message.required = true];
  // Roles to grant the certificate; at least one. Each must be a role name valid for your kind of member, for
  // example "RoleServiceProviderExternalServiceAccountAdmin" for an Issuer or
  // "RolePartnerExternalServiceAccountAdmin" for an Acceptor. An unknown or invalid role fails the request.
  repeated string roles = 3 [(validate.rules).repeated.min_items = 1];
  // How long the certificate is valid for, as a Go duration string such as "8760h" or "720h30m"; the largest unit is
  // hours. Must be positive. Defaults to one year when empty.
  string expire_in_duration = 4;
  // Friendly name for the certificate.
  string display_name = 5;
}

// Result of GenerateCertificate.
message GenerateCertificateResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The certificate was signed; see `certificate`.
    STATUS_SUCCESS = 1;
    // The certificate was not issued, for example because the CSR could not be decoded, a role is invalid or the
    // duration is not valid; see `error`.
    STATUS_ERROR = 2;
  }
  // Outcome of the call.
  Status status = 1;

  // Why the call failed. Set when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;

  // The new certificate, including the signed PEM and Mica's CA certificates.
  ToMicaCertificate certificate = 3;
}

// Request to enable a certificate.
message EnableCertificateRequest {
  // Serial number of the certificate, as returned in `ToMicaCertificate.serial_number`. Required.
  string serial_number = 1 [(validate.rules).string.min_len = 1];
}

// Result of EnableCertificate.
message EnableCertificateResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The certificate is now enabled.
    STATUS_SUCCESS = 1;
    // The change was not made, for example because no certificate has that serial number; see `error`.
    STATUS_ERROR = 2;
  }
  // Outcome of the call.
  Status status = 1;

  // Why the call failed. Set when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;
  // Serial number of the certificate that was changed.
  string serial_number = 3;
}

// Request to disable a certificate.
message DisableCertificateRequest {
  // Serial number of the certificate, as returned in `ToMicaCertificate.serial_number`. Required.
  string serial_number = 1 [(validate.rules).string.min_len = 1];
}

// Result of DisableCertificate.
message DisableCertificateResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The certificate is now disabled.
    STATUS_SUCCESS = 1;
    // The change was not made, for example because no certificate has that serial number; see `error`.
    STATUS_ERROR = 2;
  }
  // Outcome of the call.
  Status status = 1;

  // Why the call failed. Set when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;
  // Serial number of the certificate that was changed.
  string serial_number = 3;
}

// Request for one certificate.
message GetCertificateRequest {
  // Serial number of the certificate, as a decimal string. Required.
  string serial_number = 1 [(validate.rules).string.min_len = 1];
}

// Result of GetCertificate.
message GetCertificateResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // `certificate` is set.
    STATUS_SUCCESS = 1;
    // No certificate has that serial number.
    STATUS_NOT_FOUND = 2;
    // The certificate could not be read; see `error`.
    STATUS_ERROR = 3;
  }
  // Outcome of the call.
  Status status = 1;

  // Why the call failed. Set when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;

  // The certificate, including its PEM data.
  ToMicaCertificate certificate = 3;
}

// Takes no parameters: every certificate is returned.
message SearchCertificateRequest {}

// Result of SearchCertificate.
message SearchCertificateResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // `certificates` holds the results; it may be empty.
    STATUS_SUCCESS = 1;
    // The certificates could not be listed; see `error`.
    STATUS_ERROR = 2;
  }
  // Outcome of the call.
  Status status = 1;

  // Why the call failed. Set when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;
  // Every certificate issued for this member, without PEM data.
  repeated ToMicaCertificate certificates = 3;
}