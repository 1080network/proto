syntax = "proto3";

package mica.acceptor.service.v2;

option go_package = "mica/acceptor/servicev2";
option java_outer_classname = "AcceptorFromMicaServiceProto";
option java_package = "io.mica.acceptor.service.v2";
option objc_class_prefix = "MICA";

// The service an Acceptor would implement for Mica to call. It has no operations yet, so there is nothing to
// implement.
service AcceptorFromMicaService {
  // Possible operations:
  //  - operation to support reverse onboarding. Instead of the Acceptor calling Mica, Mica will call the Acceptor with a
  //    new enrollment. For example, a User starting at the Mica user website could sign up for Netflix assuming that
  //    Netflix supported Mica and have implemented this API.
}
