syntax = "proto3";

package mica.issuer.instrument.v2;

import "google/protobuf/timestamp.proto";
import "mica/common/v1/currency.proto";
import "micashared/common/v1/instrument.proto";
import "micashared/common/v1/error.proto";
import "validate/validate.proto";

option go_package = "mica/issuer/instrumentv2";
option java_outer_classname = "InstrumentProto";
option java_package = "io.mica.issuer.instrument.v2";
option objc_class_prefix = "MICA";

message RegisterInstrumentRequest {
  reserved 1, 4;

  // The registered user who owns the instrument. One identifier is required.
  oneof user_identifier {
    // Mica's key for the user.
    string issuer_user_key = 7 [(validate.rules).string = {max_len: 50}];

    // The Issuer's own identifier for the user.
    string issuer_user_ref = 6 [(validate.rules).string = {max_len: 100}];
  }

  // The Issuer's own identifier for the instrument (up to 100 characters). Required, and must be unique among the
  // user's instruments.
  string issuer_instrument_ref = 2 [(validate.rules).string.max_len = 100];

  // The kind of instrument, by name (case-sensitive): "Promotion", "GovernmentBenefit", "TaxAdvantaged",
  // "EmployerBenefit", "MerchantCredit", "Prepaid", "DepositAccount" or "CreditAccount". May be left empty. Any other
  // value is rejected as an invalid argument.
  string instrument_type = 3;

  // A display name for the instrument that can be shown to the user, for example the last four digits of the account
  // number.
  string nickname = 5;

  // The currency the instrument holds. Required.
  mica.common.v1.Currency currency = 8 [(validate.rules).message = {required: true}];

  // The adjudication programs the instrument is adjudicated against, each up to 50 characters. Leave empty for an
  // instrument that isn't adjudicated. At most one code is accepted for now.
  repeated string adjudication_program_codes = 9 [(validate.rules).repeated.items.string.max_len = 50];
}

message RegisterInstrumentResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The instrument was registered.
    STATUS_SUCCESS = 1;
    // The request failed, for example because `issuer_instrument_ref` is missing or the currency is invalid; see
    // `error`.
    STATUS_ERROR = 2;
    // The user already has an instrument with this `issuer_instrument_ref`.
    STATUS_DUPLICATE = 3;
    // The user was not found.
    STATUS_NOT_FOUND = 4;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;

  // Mica's key for the new instrument. Store it to address the instrument in later calls.
  string issuer_instrument_key = 3 [(validate.rules).string = {
    min_len: 30,
    max_len: 50
  }];

  // Version of the new instrument record.
  int64 version = 4;
}

// Identifies an instrument by the Issuer's own references instead of Mica's key. Both fields are required, because an
// instrument reference only has to be unique within its user.
message InstrumentExternalReference {
  // The Issuer's own identifier for the user who owns the instrument.
  string issuer_user_ref = 1 [(validate.rules).string = {min_len: 1}];
  // The Issuer's own identifier for the instrument.
  string issuer_instrument_ref = 2 [(validate.rules).string = {min_len: 1}];
}

message GetInstrumentRequest {
  reserved 2;

  // The instrument to return. Exactly one identifier is required.
  oneof instrument_identifier {
    option (validate.required) = true;

    // Mica's key for the instrument.
    string issuer_instrument_key = 1 [(validate.rules).string = {
      min_len: 30,
      max_len: 50
    }];

    // The Issuer's own user and instrument references.
    InstrumentExternalReference external_reference = 3;
  }
}

// An instrument (account) the Issuer has registered with Mica.
message Instrument {
  reserved 9;

  // Mica's key for the instrument.
  string issuer_instrument_key = 1 [(validate.rules).string = {
    min_len: 30,
    max_len: 50
  }];

  // Record version, used for optimistic locking.
  int64 version = 2;

  // When the instrument was registered at Mica.
  google.protobuf.Timestamp created = 3;

  // When the instrument record was last updated at Mica.
  google.protobuf.Timestamp updated = 4;

  // The Issuer's own identifier for the instrument.
  string issuer_instrument_ref = 5 [(validate.rules).string.max_len = 100];

  // Mica's key for the user who owns the instrument.
  string issuer_user_key = 6 [(validate.rules).string = {
    min_len: 30,
    max_len: 50
  }];

  // The Issuer's own identifier for the user who owns the instrument.
  string issuer_user_ref = 7 [(validate.rules).string.max_len = 100];

  // The kind of instrument, by name (see RegisterInstrumentRequest.instrument_type). Empty if none was given.
  string instrument_type = 8;

  // The display name given at registration, for example the last four digits of the account number.
  string nickname = 10;

  // The currency the instrument holds.
  mica.common.v1.Currency currency = 11 [(validate.rules).message = {required: true}];
}

message GetInstrumentResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The instrument is returned in `instrument`.
    STATUS_SUCCESS = 1;
    // The request failed for another reason, for example an undecodable instrument key; see `error`.
    STATUS_ERROR = 2;
    // No registered instrument matches the identifier.
    STATUS_NOT_FOUND = 3;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;

  // The instrument. Set only on STATUS_SUCCESS.
  Instrument instrument = 3;
}

message RemoveInstrumentRequest {
  reserved 2;

  // The instrument to remove. Exactly one identifier is required.
  oneof instrument_identifier {
    option (validate.required) = true;

    // Mica's key for the instrument.
    string issuer_instrument_key = 1 [(validate.rules).string = {
      min_len: 30,
      max_len: 50
    }];

    // The Issuer's own user and instrument references.
    InstrumentExternalReference external_reference = 3;
  }
}

message RemoveInstrumentResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The instrument was removed.
    STATUS_SUCCESS = 1;
    // The request failed for another reason; see `error`.
    STATUS_ERROR = 2;
    // No registered instrument matches the identifier.
    STATUS_NOT_FOUND = 3;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;
}

// Identifies the user whose instruments SearchInstrument returns.
message SearchInstrumentRequest {
  // The user whose instruments to return.
  oneof criteria {
    // Mica's key for the user.
    string issuer_user_key = 1 [(validate.rules).string = {max_len: 50}];

    // The Issuer's own identifier for the user. Not currently supported: a request using it returns STATUS_ERROR, so
    // use `issuer_user_key`.
    string issuer_user_ref = 2 [(validate.rules).string = {max_len: 100}];
  }
}

message SearchInstrumentResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The user's instruments are returned in `instruments`.
    STATUS_SUCCESS = 1;
    // The request failed for another reason, for example missing criteria; see `error`.
    STATUS_ERROR = 2;
    // The user was not found.
    STATUS_NOT_FOUND = 3;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;

  // The instruments registered for the user.
  repeated Instrument instruments = 3;
}

message ProvisionInstrumentLinkingCodeRequest {
  // The user who is starting the link. Exactly one identifier is required.
  oneof user_identifier {
    option (validate.required) = true;

    // The Issuer's own identifier for the user.
    string issuer_user_ref = 1 [(validate.rules).string.max_len = 100];
    // Mica's key for the user.
    string issuer_user_key = 2 [(validate.rules).string = {
      min_len: 30,
      max_len: 50
    }];
  }

  // The user's instrument (account) that the other member will be able to pay from once linked. Exactly one identifier
  // is required.
  oneof instrument_identifier {
    option (validate.required) = true;

    // The Issuer's own identifier for the instrument.
    string issuer_instrument_ref = 3 [(validate.rules).string.max_len = 100];
    // Mica's key for the instrument.
    string issuer_instrument_key = 4 [(validate.rules).string = {
      min_len: 30,
      max_len: 50
    }];
  }

  // Optional information to pass to the member on the other side of the link (for example, the merchant) once the
  // link has been completed.
  micashared.common.v1.InstrumentLinkClaims claims = 5;

  // Optional constraints on how the link may be used.
  LinkUsageProfile usage_profile = 6;
}

message ProvisionInstrumentLinkingCodeResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // A linking code is returned in `linking_code`.
    STATUS_SUCCESS = 1;
    // The request failed for another reason; see `error`.
    STATUS_ERROR = 2;
    // No registered instrument matches the instrument identifier.
    STATUS_INSTRUMENT_NOT_FOUND = 3;
    // No registered user matches the user identifier.
    STATUS_USER_NOT_FOUND = 4;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;

  // The code to display or send to the user, who enters it wherever the other member asks for it.
  string linking_code = 3;
}

message CompleteLinkingWithCodeRequest{
  // The linking code the user obtained from the other member.
  string linking_code = 1;
  // The user the link attaches to. One identifier is required.
  oneof to_user{
    // The Issuer's own identifier for the user.
    string user_ref = 2 [(validate.rules).string.max_len = 100];
    // Mica's key for the user.
    string user_key = 3 [(validate.rules).string = {
      min_len: 30,
      max_len: 50
    }];
  }

  // The user's instrument the link attaches to. One identifier is required.
  oneof to_instrument{
    // The Issuer's own identifier for the instrument.
    string instrument_ref = 4 [(validate.rules).string.max_len = 100];
    // Mica's key for the instrument.
    string instrument_key = 5 [(validate.rules).string = {
      min_len: 30,
      max_len: 50
    }];
  }
}

message CompleteLinkingWithCodeResponse{
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The link was completed and is returned in `instrument_link`. If the same link already existed, the existing link
    // is returned.
    STATUS_SUCCESS = 1;
    // The member that issued the code is in a different network group, so the two cannot be linked.
    STATUS_INVALID_NETWORK = 2;
    // The instrument or account on the other side of the link cannot be linked.
    STATUS_UNSUPPORTED_LINK_SOURCE = 3;
    // No registered user matches the user identifier.
    STATUS_USER_NOT_FOUND = 4;
    // No registered instrument matches the instrument identifier.
    STATUS_INSTRUMENT_NOT_FOUND = 5;
    // The linking code is unknown or no longer valid, for example because it has already been used.
    STATUS_INVALID_CODE = 6;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;

  // The completed link. Set only on STATUS_SUCCESS.
  InstrumentLink instrument_link = 3;

  // Any claims the member that issued the linking code attached to the link.
  micashared.common.v1.InstrumentLinkClaims claims = 4;
}

message GetInstrumentLinkRequest{
  // Mica's key for the link, as returned in InstrumentLink.link_key.
  string link_key = 1;
}

message GetInstrumentLinkResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The link is returned in `instrument_link`.
    STATUS_SUCCESS = 1;
    // No link matches `link_key`.
    STATUS_LINK_NOT_FOUND = 2;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;

  // The link. Set only on STATUS_SUCCESS.
  InstrumentLink instrument_link = 3;
}

// Searches the established instrument links by user, by instrument, or both. When both are set, a link must match both.
message SearchInstrumentLinksRequest {
  // Return links for this user.
  oneof by_user{
    // The Issuer's own identifier for the user.
    string user_ref = 1 [(validate.rules).string.max_len = 100];
    // Mica's key for the user.
    string user_key = 2 [(validate.rules).string = {
      min_len: 30,
      max_len: 50
    }];
  }

  // Return links for this instrument.
  oneof by_instrument{
    // The Issuer's own identifier for the instrument.
    string instrument_ref = 3 [(validate.rules).string.max_len = 100];
    // Mica's key for the instrument.
    string instrument_key = 4 [(validate.rules).string = {
      min_len: 30,
      max_len: 50
    }];
  }
}

message SearchInstrumentLinksResponse{
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // Matching links are returned in `instrument_links`.
    STATUS_SUCCESS = 1;
    // No established link matches the criteria.
    STATUS_NOT_FOUND = 2;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;

  // The matching links.
  repeated InstrumentLink instrument_links = 3;
}

message RemoveInstrumentLinkRequest{
  // Mica's key for the link to remove.
  string link_key = 1;
}

message RemoveInstrumentLinkResponse{
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The link was removed.
    STATUS_SUCCESS = 1;
    // No link matches `link_key`.
    STATUS_NOT_FOUND = 2;
    // The link cannot be removed because it is in use.
    STATUS_LINK_IN_USE = 3;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;
}

// Constraints on how an instrument link may be used.
message LinkUsageProfile {
  // Set to true if the link is intended for a single use only.
  bool for_one_time_use = 1;
  //todo maybe have something that pre-defines the link type? for example
  // another account I own, an account owned by someone else? 
}

// A link between one of the Issuer's instruments and another member of the network (for example, a merchant where
// the user saved the instrument as a payment method).
message InstrumentLink {
  // Mica's key for the link.
  string link_key = 1;

  // Record version, used for optimistic locking.
  int64 version = 2;

  // When the link was created at Mica.
  google.protobuf.Timestamp created = 3;

  // When the link was last updated at Mica.
  google.protobuf.Timestamp updated = 4;

  // Mica's key for the Issuer's user on this side of the link.
  string issuer_user_key = 5;

  // The Issuer's own identifier for the user on this side of the link.
  string issuer_user_ref = 6;

  // The Issuer's own identifier for the instrument on this side of the link.
  string issuer_instrument_ref = 7;

  // Mica's key for the instrument on this side of the link.
  string issuer_instrument_key = 8;

  // The name of the organization on the other side of the link.
  string organization_name = 9;

  // The URL of the icon of the organization on the other side of the link.
  string organization_icon_url = 10;

  // Display details (name and type) of the linked instrument, where available.
  micashared.common.v1.LinkedInstrumentData linked_instrument_data = 11;
}