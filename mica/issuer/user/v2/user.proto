syntax = "proto3";

package mica.issuer.user.v2;

import "google/protobuf/timestamp.proto";
import "micashared/common/enums/ageband/v1/age_band.proto";
import "micashared/common/v1/error.proto";
import "validate/validate.proto";

option go_package = "mica/issuer/userv2";
option java_outer_classname = "UserProto";
option java_package = "io.mica.issuer.user.v2";
option objc_class_prefix = "MICA";

// The coarse location of a user. Mica stores only the region and country, never a street address. Set both fields or
// neither.
message Address {
  reserved 3, 4, 5; reserved "postal_code";

  // The subdivision part (1-3 characters) of the ISO 3166-2 code, without the country prefix: the state in the US,
  // the prefecture in Japan, the state or territory in Australia. For example, the US state of Virginia is "US-VA",
  // so `region_code` is "VA" and `country_code` is "US"; the Japanese prefecture of Kanagawa is "JP-14", so
  // `region_code` is "14" and `country_code` is "JP".
  string region_code = 6 [(validate.rules).string = {max_len: 3}];

  // The ISO 3166-1 alpha-2 country code (2 characters), for example "US" for the United States, "JP" for Japan or
  // "AU" for Australia.
  string country_code = 7 [(validate.rules).string.max_len = 2];
}

// Demographic data the Issuer shares with Mica about a user. Mica holds only coarse, non-identifying data.
message UserDemographic {
  reserved 6; reserved "phone";

  // The user's region and country.
  Address address = 4;

  // The user's age range.
  micashared.common.enums.ageband.v1.AgeBand age_band = 7;
}

// A user the Issuer has registered with Mica.
message User {
  // Record version, used for optimistic locking. Pass it back in UpdateUserRequest.version.
  int64 version = 1;

  // When the user was registered at Mica.
  google.protobuf.Timestamp created = 2;

  // When the user record was last updated at Mica.
  google.protobuf.Timestamp updated = 3;

  // Mica's key for the user, assigned by RegisterUser.
  string issuer_user_key = 4 [(validate.rules).string = {
    min_len: 30,
    max_len: 50
  }];

  // The Issuer's own identifier for the user (up to 100 characters).
  string issuer_user_ref = 5 [(validate.rules).string.max_len = 100];

  // Demographic data held for the user.
  UserDemographic user_demographic = 6;
}

// Requests and responses for the user operations of IssuerToMicaService.

message RegisterUserRequest {
  // The Issuer's own identifier for the user (up to 100 characters). Required, and must be unique among the Issuer's
  // registered users.
  string issuer_user_ref = 8 [(validate.rules).string.max_len = 100];

  // Optional demographic data for the user.
  UserDemographic user_demographic = 1;
}

message RegisterUserResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The user was registered.
    STATUS_SUCCESS = 1;
    // The request failed, for example because `issuer_user_ref` is missing or the demographic data is invalid; see
    // `error`.
    STATUS_ERROR = 2;
    // A user with this `issuer_user_ref` is already registered.
    STATUS_DUPLICATE = 3;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;

  // Mica's key for the new user. Store it to address the user in later calls.
  string issuer_user_key = 3 [(validate.rules).string = {
    min_len: 30,
    max_len: 50
  }];

  // Version of the new user record.
  int64 version = 4;
}

message UpdateUserRequest {
  reserved 1;

  // The user to update. One identifier is required.
  oneof user_identifier {
    // Mica's key for the user.
    string issuer_user_key = 5 [(validate.rules).string = {max_len: 50}];

    // The Issuer's own identifier for the user.
    string issuer_user_ref = 4 [(validate.rules).string = {max_len: 100}];
  }

  // The current version of the user record, as last returned by Mica. The update is rejected with
  // STATUS_VERSION_MISMATCH if the record has changed since.
  int64 version = 2;

  // The new demographic data. The address always replaces the stored one (an empty address clears it); the age band is
  // only changed when it is set.
  UserDemographic user_demographic = 3;
}

message UpdateUserResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The user was updated.
    STATUS_SUCCESS = 1;
    // The request failed for another reason; see `error`.
    STATUS_ERROR = 2;
    // No registered user matches the identifier.
    STATUS_NOT_FOUND = 3;
    // `version` does not match the stored record. Fetch the user again with GetUser and retry with its version.
    STATUS_VERSION_MISMATCH = 4;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;

  // The new version of the user record.
  int64 version = 3;
}

message RemoveUserRequest {
  reserved 1;

  // The user to remove. One identifier is required.
  oneof user_identifier {
    // Mica's key for the user.
    string issuer_user_key = 3 [(validate.rules).string = {max_len: 50}];

    // The Issuer's own identifier for the user.
    string issuer_user_ref = 2 [(validate.rules).string = {max_len: 100}];
  }
}

message RemoveUserResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The user was removed.
    STATUS_SUCCESS = 1;
    // The request failed for another reason; see `error`.
    STATUS_ERROR = 2;
    // No registered user matches the identifier.
    STATUS_NOT_FOUND = 3;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;
}

message GetUserRequest {
  reserved 1;

  // The user to return. One identifier is required.
  oneof user_identifier {
    // Mica's key for the user.
    string issuer_user_key = 3 [(validate.rules).string = {max_len: 50}];

    // The Issuer's own identifier for the user.
    string issuer_user_ref = 2 [(validate.rules).string = {max_len: 100}];
  }
}

message GetUserResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The user is returned in `user`.
    STATUS_SUCCESS = 1;
    // The request failed for another reason, for example an undecodable user key; see `error`.
    STATUS_ERROR = 2;
    // No registered user matches the identifier.
    STATUS_NOT_FOUND = 3;
  }
  Status status = 1;

  // Details of the failure when `status` is not STATUS_SUCCESS.
  micashared.common.v1.Error error = 2;

  // The user. Set only on STATUS_SUCCESS.
  User user = 3;
}
