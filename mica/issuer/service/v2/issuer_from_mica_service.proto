option go_package = "mica/issuer/servicev2";
option java_outer_classname = "IssuerFromMicaServiceProto";
option java_package = "io.mica.issuer.service.v2";
option objc_class_prefix = "MICA";

// Operations Mica calls on the Issuer. The Issuer hosts this service at the callback address configured with
// IssuerAdministrationService.UpdateFromMicaClientCallbackAddress, and Mica authenticates with the client certificate
// enabled through that administration service.
//
// Each value operation asks the Issuer to move value on one of its instruments for a network transaction. The
// operations correspond to those on AcceptorToMicaValueService.
//
// Every value operation runs in two steps, identified by `transaction_identifier` and the instrument, so that Mica can
// apply a transaction completely or not at all. The request's `phase` says which step it is:
//   "PREFLIGHT" - check that the operation can be applied and reserve what it needs, without applying it
//   "COMMIT"    - apply the operation, for the amount approved at preflight
//   "ROLLBACK"  - release what the preflight reserved; nothing is applied
// Reject a request whose `phase` is anything else. A request whose preflight result Mica did not receive is always
// rolled back. Mica may repeat a COMMIT or ROLLBACK it did not get an answer to, so apply each only once.
//
// The Issuer reports its decision in the response. A failure to process the request at all, rather than a decline, is
// reported as a gRPC status code, and an operation the Issuer does not support returns UNIMPLEMENTED.
service IssuerFromMicaService {
  // Asks the Issuer to take value from the instrument for a payment. The Issuer may approve less than `amount` at
  // preflight.
  rpc ObtainValue(ObtainValueRequest) returns (ObtainValueResponse) {}

  // Asks the Issuer to reverse an earlier ObtainValue in full, returning everything it took to the instrument.
  rpc ReverseObtainValue(ReverseObtainValueRequest) returns (ReverseObtainValueResponse) {}

  // Asks the Issuer to credit the instrument with part or all of an earlier payment, for example for a returned
  // item.
  rpc RefundValue(RefundValueRequest) returns (RefundValueResponse) {}

  // Asks the Issuer to credit the instrument for a payout: value sent to the user that does not refer to an earlier
  // payment.
  rpc PayoutValue(PayoutValueRequest) returns (PayoutValueResponse) {}

  // Asks the Issuer to reserve value on the instrument until `expiration`. The hold is later captured with
  // ObtainHoldValue, released with ReleaseHoldValue, or left to expire.
  rpc HoldValue(HoldValueRequest) returns (HoldValueResponse) {}

  // Asks the Issuer to release an earlier hold in full without capturing it, returning all of the reserved value to
  // the instrument.
  rpc ReleaseHoldValue(ReleaseHoldValueRequest) returns (ReleaseHoldValueResponse) {}

  // Asks the Issuer to take value against an earlier hold, once the final amount is known. This settles the hold.
  rpc ObtainHoldValue(ObtainHoldValueRequest) returns (ObtainHoldValueResponse) {}

  // Informs the Issuer about steps of value operations that Mica could not complete with the Issuer, for example a
  // COMMIT the Issuer did not answer in time. The Issuer should acknowledge promptly and reconcile afterwards, undoing
  // any value movement it applied for a transaction the network declined. Not sent by the current network release.
  rpc ValueAdvice(ValueAdviceRequest) returns (ValueAdviceResponse) {}

  // Lets Mica check that the Issuer's service is reachable and that the mTLS connection works. Mica calls this when
  // the Issuer tests connectivity with IssuerAdministrationService.PingExternal or enables a new client certificate.
  rpc Ping(IssuerFromMicaServicePingRequest) returns (IssuerFromMicaServicePingResponse) {}
}

// Every value request numbers the fields it shares with the others the same way:
//   1 plan_name, 2 phase, 3 amount, 4 currency, 5 transaction_identifier, 6 issuer_instrument_key,
//   7 instrument_external_reference, 8 risk_signal, 9 location_details, 10 original_transaction_identifier,
//   11 expiration.
// Every value response is a transaction_ref (1) and a result (approved 2, declined 3).

// A request to take value from the instrument for one step of a payment.
message ObtainValueRequest {
  // The name of the plan Mica is using to process the transaction, for reference.
  string plan_name = 1;

  // Which step this is: "PREFLIGHT", "COMMIT" or "ROLLBACK".
  string phase = 2 [(validate.rules).string = {in: ["PREFLIGHT", "COMMIT", "ROLLBACK"]}];

  // The amount to take, as a decimal string. On COMMIT and ROLLBACK it is the amount the Issuer approved at
  // preflight.
  string amount = 3;

  // The currency of `amount`.
  mica.common.v1.Currency currency = 4 [(validate.rules).message.required = true];

  // Mica's network-wide identifier and time for the payment. The same for every step, so use it to match the
  // COMMIT or ROLLBACK to the PREFLIGHT.
  micashared.common.v1.TransactionIdentifier transaction_identifier = 5;

  // Mica's key for the instrument to debit.
  string issuer_instrument_key = 6;

  // The Issuer's own user and instrument references for the instrument.
  mica.issuer.instrument.v2.InstrumentExternalReference instrument_external_reference = 7;

  // Information about where and how the payment originated, supplied by the Acceptor for the Issuer's risk and
  // fraud checks. May be empty.
  micashared.common.v1.RiskSignal risk_signal = 8;

  // Where the payment took place.
  LocationDetails location_details = 9;
}

message ObtainValueResponse {
  // The Issuer's own reference for this step of the payment (up to 100 characters). Mica sends the reference from
  // the COMMIT back as `original_transaction_identifier.transaction_ref` in later operations that refer to it.
  string transaction_ref = 1 [(validate.rules).string.max_len = 100];

  // The Issuer's decision. Exactly one is set.
  oneof result {
    // The payment is approved for `approved.approved_amount`, which may be less than the amount requested.
    ApprovedResult approved = 2;

    // The payment is declined.
    DeclinedResult declined = 3;
  }
}

// A request to reverse an earlier payment in full, for one step.
message ReverseObtainValueRequest {
  // The name of the plan Mica is using to process the transaction, for reference.
  string plan_name = 1;

  // Which step this is: "PREFLIGHT", "COMMIT" or "ROLLBACK".
  string phase = 2 [(validate.rules).string = {in: ["PREFLIGHT", "COMMIT", "ROLLBACK"]}];

  // Mica's network-wide identifier and time for the reversal. The same for every step, so use it to match the
  // COMMIT or ROLLBACK to the PREFLIGHT.
  micashared.common.v1.TransactionIdentifier transaction_identifier = 5;

  // Mica's key for the instrument to credit.
  string issuer_instrument_key = 6;

  // The Issuer's own user and instrument references for the instrument.
  mica.issuer.instrument.v2.InstrumentExternalReference instrument_external_reference = 7;

  // Information about where and how the reversal originated, supplied by the Acceptor for the Issuer's risk and
  // fraud checks. May be empty.
  micashared.common.v1.RiskSignal risk_signal = 8;

  // Where the reversal took place.
  LocationDetails location_details = 9;

  // The payment being reversed.
  OriginalTransactionIdentifier original_transaction_identifier = 10 [(validate.rules).message.required = true];
}

message ReverseObtainValueResponse {
  // The Issuer's own reference for this step of the reversal (up to 100 characters). Mica sends the reference from
  // the COMMIT back as `original_transaction_identifier.transaction_ref` in later operations that refer to it.
  string transaction_ref = 1 [(validate.rules).string.max_len = 100];

  // The Issuer's decision. Exactly one is set.
  oneof result {
    // The reversal is approved; `approved.approved_amount` is the amount returned to the instrument.
    ApprovedResult approved = 2;

    // The reversal is declined.
    DeclinedResult declined = 3;
  }
}

// A request to credit the instrument with part or all of an earlier payment, for one step.
message RefundValueRequest {
  // The name of the plan Mica is using to process the transaction, for reference.
  string plan_name = 1;

  // Which step this is: "PREFLIGHT", "COMMIT" or "ROLLBACK".
  string phase = 2 [(validate.rules).string = {in: ["PREFLIGHT", "COMMIT", "ROLLBACK"]}];

  // The amount to credit, as a decimal string. At most the amount the original payment took from this instrument,
  // less any earlier refunds of it.
  string amount = 3;

  // The currency of `amount`.
  mica.common.v1.Currency currency = 4 [(validate.rules).message.required = true];

  // Mica's network-wide identifier and time for the refund. The same for every step, so use it to match the
  // COMMIT or ROLLBACK to the PREFLIGHT.
  micashared.common.v1.TransactionIdentifier transaction_identifier = 5;

  // Mica's key for the instrument to credit.
  string issuer_instrument_key = 6;

  // The Issuer's own user and instrument references for the instrument.
  mica.issuer.instrument.v2.InstrumentExternalReference instrument_external_reference = 7;

  // Information about where and how the refund originated, supplied by the Acceptor for the Issuer's risk and
  // fraud checks. May be empty.
  micashared.common.v1.RiskSignal risk_signal = 8;

  // Where the refund took place.
  LocationDetails location_details = 9;

  // The payment being refunded.
  OriginalTransactionIdentifier original_transaction_identifier = 10 [(validate.rules).message.required = true];
}

message RefundValueResponse {
  // The Issuer's own reference for this step of the refund (up to 100 characters). Mica sends the reference from
  // the COMMIT back as `original_transaction_identifier.transaction_ref` in later operations that refer to it.
  string transaction_ref = 1 [(validate.rules).string.max_len = 100];

  // The Issuer's decision. Exactly one is set.
  oneof result {
    // The refund is approved for `approved.approved_amount`.
    ApprovedResult approved = 2;

    // The refund is declined.
    DeclinedResult declined = 3;
  }
}

