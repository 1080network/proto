// A request to take value against an earlier hold, for one step.
message ObtainHoldValueRequest {
  // The name of the plan Mica is using to process the transaction, for reference.
  string plan_name = 1;

  // Which step this is: "PREFLIGHT", "COMMIT" or "ROLLBACK".
  string phase = 2 [(validate.rules).string = {in: ["PREFLIGHT", "COMMIT", "ROLLBACK"]}];

  // The final amount to take, as a decimal string. At most the amount held.
  string amount = 3;

  // The currency of `amount`.
  mica.common.v1.Currency currency = 4 [(validate.rules).message.required = true];

  // Mica's network-wide identifier and time for the capture. The same for every step, so use it to match the
  // COMMIT or ROLLBACK to the PREFLIGHT.
  micashared.common.v1.TransactionIdentifier transaction_identifier = 5;

  // Mica's key for the instrument to debit.
  string issuer_instrument_key = 6;

  // The Issuer's own user and instrument references for the instrument.
  mica.issuer.instrument.v2.InstrumentExternalReference instrument_external_reference = 7;

  // Information about where and how the capture originated, supplied by the Acceptor for the Issuer's risk and
  // fraud checks. May be empty.
  micashared.common.v1.RiskSignal risk_signal = 8;

  // Where the capture took place.
  LocationDetails location_details = 9;

  // The hold being captured.
  OriginalTransactionIdentifier original_transaction_identifier = 10 [(validate.rules).message.required = true];
}

message ObtainHoldValueResponse {
  // The Issuer's own reference for this step of the capture (up to 100 characters). Mica sends the reference from
  // the COMMIT back as `original_transaction_identifier.transaction_ref` in later operations that refer to it.
  string transaction_ref = 1 [(validate.rules).string.max_len = 100];

  // The Issuer's decision. Exactly one is set.
  oneof result {
    // The capture is approved for `approved.approved_amount`.
    ApprovedResult approved = 2;

    // The capture is declined.
    DeclinedResult declined = 3;
  }
}

// Request for the Issuer's Ping operation. It has no fields.
message IssuerFromMicaServicePingRequest {}

// Response for the Issuer's Ping operation. It has no fields; returning it without an error is enough.
message IssuerFromMicaServicePingResponse {}

// Where a transaction took place.
message LocationDetails {
  // Mica's key for the Acceptor organization where the transaction took place.
  string organization_key = 1 [(validate.rules).string = {max_len: 50}];

  // Name of the organization where the transaction took place.
  string organization_name = 2;

  // Address of the organization where the transaction took place.
  micashared.common.v1.Address organization_address = 3;

  // The organization category this transaction is for, in the form AAA-BBB (for example COM-GRO). See
  // https://developer.mica.io/apis/organization-categories/
  string category = 4;

  // Identifier of the clerk who processed the transaction, if the Acceptor supplied one.
  string clerk_identifier = 7;
}

// The earlier transaction a follow-up operation applies to: the payment being reversed or refunded, or the hold being
// released or captured. It is on the same instrument as the request.
message OriginalTransactionIdentifier {
  // Mica's network-wide identifier and time for the earlier transaction.
  micashared.common.v1.TransactionIdentifier transaction_identifier = 1;

  // The Issuer's own reference for the earlier transaction, as the Issuer returned it on that transaction's COMMIT.
  string transaction_ref = 2 [(validate.rules).string.max_len = 100];
}

// The Issuer approved the request.
message ApprovedResult {
  // The amount approved, as a decimal string in the request's currency. On PREFLIGHT it is the amount Mica later
  // commits or rolls back. It may be less than the amount requested only for an operation that allows partial
  // approval.
  string approved_amount = 1;
}

// The Issuer declined the request.
message DeclinedResult {
  // Why the Issuer declined, as a code Mica can act on and pass on to the Acceptor. The codes are not defined yet.
  string code = 1;

  // A human-readable description of the decline, for logs and support. Not shown to the user.
  string message = 2;
}

// Tells the Issuer about steps of value operations that Mica could not complete with the Issuer. It does not need
// real-time handling: acknowledge it promptly and reconcile afterwards.
message ValueAdviceRequest {
  // The advices being delivered.
  repeated ValueAdvice value_advices = 1;
}

// Returned to acknowledge the advices. It has no fields; returning it without an error means they were received.
message ValueAdviceResponse {}

// One step of a value operation that Mica could not complete with the Issuer.
message ValueAdvice {
  // Processing priority for this advice: the lower the number, the higher the priority. Advices about Issuer timeouts
  // and unavailability have the highest priority, because the Issuer may have applied those steps.
  int32 advice_priority = 1;

  // Why Mica could not complete the step:
  //   "ISSUER_TIMEOUT"     - the Issuer did not answer in time; it may have applied the step
  //   "ISSUER_UNAVAILABLE" - the Issuer was considered unavailable, so Mica did not wait for an answer
  //   "ERROR"              - Mica could not complete the step for another reason
  string advice_reason = 2;

  // The operation, named after its operation on this service: "ObtainValue", "ReverseObtainValue", "RefundValue",
  // "PayoutValue", "HoldValue", "ReleaseHoldValue" or "ObtainHoldValue".
  string operation = 3;

  // The step Mica could not complete: "PREFLIGHT", "COMMIT" or "ROLLBACK".
  string phase = 4;

  // The amount of the step, as a decimal string. Empty for an operation that has no amount.
  string amount = 5;

  // The currency of `amount`.
  mica.common.v1.Currency currency = 6;

  // Mica's network-wide identifier and time for the operation, as sent in the step's request.
  micashared.common.v1.TransactionIdentifier transaction_identifier = 7;

  // Mica's key for the instrument.
  string issuer_instrument_key = 8;

  // The Issuer's own user and instrument references for the instrument.
  mica.issuer.instrument.v2.InstrumentExternalReference instrument_external_reference = 9;

  // The earlier transaction the operation applies to, for a reversal, refund, release or capture.
  OriginalTransactionIdentifier original_transaction_identifier = 10;

  // The Issuer's own reference for the operation, if the Issuer returned one on an earlier step.
  string transaction_ref = 11 [(validate.rules).string.max_len = 100];
}
