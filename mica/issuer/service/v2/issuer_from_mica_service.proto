  string issuer_instrument_key = 6;

  // The Issuer's own user and instrument references for the instrument.
  mica.issuer.instrument.v2.InstrumentExternalReference instrument_external_reference = 7;

  // Information about where and how the payout originated, supplied by the Acceptor for the Issuer's risk and
  // fraud checks. May be empty.
  micashared.common.v1.RiskSignal risk_signal = 8;

