name: "Proto- proto changes - NIX PR build"
on:
  pull_request:
    branches: 'main'
  workflow_dispatch:

jobs:
  lint-protos:
    name: lint-proto
    runs-on: ubuntu-latest
    
    env:
      PROJECT_ID: 'mica-io-ops'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          
      - uses: actions/checkout@v4

      - run: nix-shell --run 'make lint'
