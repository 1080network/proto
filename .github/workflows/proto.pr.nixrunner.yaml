name: "Proto- proto changes - NIX PR build"
on:
  pull_request:
    branches: 'master'
    paths:
      - 'proto/**'
  workflow_dispatch:

jobs:
  lint-protos:
    name: lint-proto
    runs-on: nix-enabled

    env:
      PROJECT_ID: 'mica-io-ops'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: cleanup old checkout  
        run: chmod +w -R ${GITHUB_WORKSPACE}; rm -rf ${GITHUB_WORKSPACE}/*;

      - uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/62674393727/locations/global/workloadIdentityPools/github-actions/providers/github-actions'
          service_account: 'github-actions@mica-io-ops.iam.gserviceaccount.com'
      
      - id: 'setupcloud'
        name: 'Setup cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
       
      - run: nix-shell --run 'make lint'
