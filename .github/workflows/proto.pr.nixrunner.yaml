name: "Lint protos"
on:
  pull_request:
    branches: 'main'
  workflow_dispatch:

jobs:
  lint-protos:
    name: lint-proto
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable          

      - run: nix-shell --packages protobuf buf --run 'make lint'
